<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is Conditional Statement Page</title>

    <style>
        body {
            background-color: hsl(0, 70%, 50%);
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
    </style>
</head>
<body style="background-color: hsl(0, 70%, 50%); text-align: center;">
<script>
     let i = 1;
     while (i <= 10) {
        document.write("The number is " + i + "<br>");
        i++;
     }
</script>
</body>
</html>
