<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is Conditional Statement Page</title>

    <style>
        body {
            background-color: hsl(0, 70%, 50%);
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
    </style>
</head>
<body>

    <h1>Conditional Statement Example</h1>
    <p id="result"></p>

    <script>
        let age = 18;

        if (age >= 18) {
            document.getElementById("result").innerHTML = "You are eligible to vote.";
        } else {
            document.getElementById("result").innerHTML = "You are not eligible to vote.";
        }
    </script>

</body>
</html>
